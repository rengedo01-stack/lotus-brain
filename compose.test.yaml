services:
  postgres:
    image: postgres:17-alpine
    environment:
      POSTGRES_DB: ${LOTUS_TEST_POSTGRES_DB}
      POSTGRES_USER: lotus_test
      POSTGRES_PASSWORD: ${LOTUS_TEST_POSTGRES_PASSWORD}
    ports:
      - "127.0.0.1:${LOTUS_TEST_POSTGRES_PORT}:5432"
    volumes:
      - test_postgres_data:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U lotus_test -d $${POSTGRES_DB}"]
      interval: 2s
      timeout: 3s
      retries: 30
      start_period: 3s

volumes:
  test_postgres_data:
